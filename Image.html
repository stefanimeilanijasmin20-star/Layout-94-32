<!DOCTYPE html>
<html>
    <head>
        <title>Eksternal CSS</title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <!-- Cara menambahkan gambar, format gambar: jpg/ .jpeg/. -->
        <p>Ini adalah Gambar dengan ukuran normal</p>
        <img src="contoh.jpg" alt="siswi dan kepsek">

        <!-- cara memberi warna pada gambar -->
        <p>ini adalah Gambar dengan ukuran normal</p>
        <img src="contoh.jpg" alt="siswi dan kepsek" class="ukuran">

        <!-- cara menanmbahkan lengkungan pada gambar -->
        <p>ini adalah Gambar yang sudah diberi lengkungan</p>
        <img src="contoh.jpg" alt="siswi dan kepsek" class="lengkungan">

        <!-- cara menggabungkan gambar dan teks -->
        <div class="kelompok">
            <img src="contoh.jpg" alt="siswi dan kepsek">
            <p>gambar siswi dan kepsek</p>
        </div>

    <!-- Cara memberikan efek hover -->
    <div class="efek">
        <img src="contoh.jpg" alt="siswi dan kepsek">
        <p> Ini Contoh Efek Hover</p>
        </div>

        <!-- Ini font Internal -->
        <p class="Internal">Ini contoh Font Internal</p>

        <!-- ini font Eksternal -->
        <p class="Eksternal">Ini contoh Font Eksternal</p>
    </body>
</html>
